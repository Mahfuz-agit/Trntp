<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Movie Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #111111;
      font-family: system-ui, sans-serif;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
    }
    video {
      width: 100%;
      background: #f2f2f2;
      border: 1px solid #dddddd;
      border-radius: 8px;
    }
    #msg {
      margin-top: 8px;
      font-size: 14px;
      color: #555555;
    }
  </style>
</head>
<body>
  <main>
    <h1>Movie</h1>
    <video id="video" controls playsinline></video>
    <div id="msg"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
    const video = document.getElementById("video");
    const msg = document.getElementById("msg");
    const src = "video/index.m3u8";

    if (video.canPlayType("application/vnd.apple.mpegurl")) {
      // Safari, iOS
      video.src = src;
    } else if (window.Hls && Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(src);
      hls.attachMedia(video);
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) msg.textContent = "Error: " + data.type;
      });
    } else {
      msg.textContent = "Browser HLS support nei.";
    }
  </script>
</body>
</html>
